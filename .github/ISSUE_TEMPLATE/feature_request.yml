name: 功能建议
description: 提出新功能或改进想法
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        建议先搜索已有 Issue，避免重复提案。
  - type: textarea
    id: need
    attributes:
      label: 你想解决什么问题
      description: 描述实际场景与痛点，而非直接描述实现
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的方案
      description: 期望的行为 / 界面 / 接口变化
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
  - type: dropdown
    id: area
    attributes:
      label: 涉及范围
      multiple: true
      options:
        - BLE 连接 / 协议
        - 表盘安装
        - Web 界面
        - OTA / 固件
        - 性能监控
        - 串口推包
        - 文档
        - 其他
