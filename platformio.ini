; ESP32 红米 Watch 5 网络网关
; 运行环境: ESP32 开发板 (ESP32-WROOM / WROVER, 经典蓝牙 + WiFi)
[env:esp32dev]
platform = espressif32@^6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = partitions.csv
board_build.flash_size = 16MB
; Flash 模式：实测这块板子必须用 DIO。
; （曾按 WROVER-E 的理论要求改成 QIO，结果 ROM 读 bootloader 第 2 段就失败：
;   load:0x3fffff30,len:1 → RTCWDT 复位；改回 DIO 后正常启动到应用层）
board_build.flash_mode = dio
; Flash 频率：保守取 40MHz。
; 镜像头 byte3 高 4 位是 size（0x4 = 16MB），低 4 位是频率索引，
; 编码见 esptool targets/esp32.py 的 FLASH_FREQUENCY：80m=0xF, 40m=0x0, 26m=0x1, 20m=0x2。
; 所以本站固件头是 0x40（16MB | 40MHz）；若改成 80MHz 会变成 0x4F。
; WROVER 模组标称 80MHz，但 40MHz 在 DIO 下兼容性最好，实际速度感知不到差别。
board_build.f_flash = 40000000L
; ── PSRAM 启用（关键！板载 WROVER-E 自带 8MB PSRAM）────────────────────
; 默认 esp32dev 板定义不带 PSRAM，8MB 内存被闲置，网页内嵌的 HTML/JS
; 全靠芯片内置 320KB SRAM，发到一半就 Not enough memory，导致
; 「浏览器拿到 IP 但网页打不开 / 未发送任何数据」。
; 下面三个 flag 等价于框架里带 PSRAM 板定义（freenove_esp32_wrover 等）：
;   -DBOARD_HAS_PSRAM                触发 esp_psram_init()，让 malloc 能用 PSRAM
;   -mfix-esp32-psram-cache-issue    使能 PSRAM 缓存一致性补丁（ESP32 必需）
;   -mfix-esp32-psram-cache-strategy=memw
; 保留 esp32dev 的 DIO / 40MHz / 16MB 设置不变，只补 PSRAM。
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DCONFIG_BT_CLASSIC_ENABLED=1
    -DCONFIG_BT_SPP_ENABLED=1
    -DXW_FW_VERSION=\"1.6.0\"
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -mfix-esp32-psram-cache-strategy=memw
    -Os
; 离线构建：ArduinoJson 已放在 lib/ArduinoJson（避免联网拉库）
; lib_deps =
;     bblanchon/ArduinoJson@^7.2.0

; 8MB 板专用环境：继承默认 env，仅覆盖分区表与 Flash 容量
;   pio run -e esp32dev-8mb
[env:esp32dev-8mb]
extends = env:esp32dev
board_build.partitions = partitions-8mb.csv
board_build.flash_size = 8MB

; ── 诊断用：DIO 版本 ─────────────────────────────────────────────
; 如果 QIO 版本仍然起不来，用它排除「Flash 模式」这一变量：
;   pio run -e esp32dev-dio -t upload
; 能起来 → 你板子的 Flash 只支持 DIO（少数模组如此）
; 仍起不来 → 问题不在 Flash 模式，查供电 / 烧录偏移 / 模组型号
[env:esp32dev-dio]
extends = env:esp32dev
board_build.flash_mode = dio
